*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#E8F4FD;color:#1F2A44;font-family:-apple-system,"PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font-family:inherit;color:inherit;border:none;background:none;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid #2F6FD6;outline-offset:2px}
.n{font-family:"Fredoka",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif}
.app{position:relative;max-width:480px;height:100vh;height:100dvh;margin:0 auto;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column;gap:14px;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px calc(env(safe-area-inset-bottom,0px) + 18px);overflow-y:auto;overflow-x:hidden}
.screen.on{display:flex}
.card{background:#fff;border-radius:24px;box-shadow:0 4px 0 #C9DDEE}
.iconbtn{position:relative;width:48px;height:48px;border-radius:16px;background:#fff;box-shadow:0 2px 0 #C9DDEE;display:flex;align-items:center;justify-content:center;flex:none}
.press{transition:transform .06s}
.press:active{transform:translateY(3px)}
.go{min-height:72px;border-radius:36px;background:#187A4B;box-shadow:0 5px 0 #0F5232;color:#fff;display:flex;align-items:center;justify-content:center;gap:12px;font-size:25px;font-weight:900;letter-spacing:4px;flex:none;width:100%}
.ghostbtn{min-height:58px;border-radius:30px;background:#fff;box-shadow:0 4px 0 #C9DDEE;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;letter-spacing:2px;flex:none;width:100%}

/* home */
.hrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hi{font-size:14px;font-weight:700;color:#3D5A80}
.title{margin:2px 0 0;font-size:32px;font-weight:900;letter-spacing:1px}
.chip{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:5px 12px;border-radius:999px;background:#fff;font-size:13px;font-weight:700;color:#3D5A80}
.ring{position:absolute;inset:-4px;width:56px;height:56px;pointer-events:none;transform:rotate(-90deg)}
.ring circle{fill:none;stroke:#FF8A3D;stroke-width:4;stroke-linecap:round;stroke-dasharray:164;stroke-dashoffset:164}
.holding .ring circle{stroke-dashoffset:0;transition:stroke-dashoffset 2s linear}
.sec h2{margin:0 0 10px;font-size:18px;font-weight:900}
.ages{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.age{height:72px;border-radius:20px;background:#fff;box-shadow:0 3px 0 #C9DDEE;display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid transparent}
.age b{font-size:30px;line-height:1;font-weight:700}
.age span{font-size:12px;font-weight:700}
.age.sel{background:#FFC93C;border-color:#1F2A44;box-shadow:0 3px 0 #1F2A44}
.agedesc{margin:10px 0 0;padding:10px 14px;border-radius:14px;background:#fff;font-size:13px;font-weight:700;color:#3D5A80;line-height:1.5}
.ops{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.op{height:clamp(80px,12dvh,100px);border-radius:22px;border:3px solid transparent;background:#fff;box-shadow:0 4px 0 #C9DDEE;display:flex;align-items:center;justify-content:center;gap:10px;position:relative;color:#1F2A44}
.op .sym{font-size:48px;font-weight:700;line-height:1}
.op .nm{font-size:20px;font-weight:900}
.op.sel{border-color:#1F2A44;box-shadow:0 4px 0 #1F2A44}
.op .chk{display:none;position:absolute;top:8px;right:10px;width:22px;height:22px;border-radius:11px;background:#1F2A44;align-items:center;justify-content:center}
.op.sel .chk{display:flex}
.op.lock{border:3px dashed #A9C1D6;background:#F4F9FD;box-shadow:none;color:#5C7A96}
.op .lk{position:absolute;bottom:6px;right:10px;font-size:11px;font-weight:700;color:#5C7A96}
#home .go{margin-top:auto}

/* game */
.top{display:flex;align-items:center;gap:12px;flex:none}
.bar{flex:1;height:16px;border-radius:8px;background:#C9DDEE;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:8px;background:#FFC93C;transition:width .4s}
.cnt{font-size:18px;font-weight:600;color:#3D5A80;min-width:44px;text-align:right}
.qcard{padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:12px;flex:0 1 auto;min-height:0;overflow-y:auto}
.eq{display:flex;align-items:flex-start;justify-content:center;gap:8px}
.opd{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:56px}
.big{font-size:clamp(44px,7.6dvh,64px);font-weight:700;line-height:1}
.sign{font-size:clamp(38px,6.6dvh,54px);font-weight:700;line-height:1.08}
.stack{display:flex;flex-direction:column;align-items:center;gap:4px}
.tf{display:grid;gap:2px;padding:5px;border-radius:12px;background:#EEF5FB;justify-items:center}
.tf.box{border:3px solid #1F2A44;background:#fff}
.tf span{display:block;width:var(--es);height:calc(var(--es) * 1.18);font-size:var(--es);line-height:1.18;text-align:center;position:relative}
.tf span.hl{background:#FFE3CC;border-radius:6px}
.tf span.x i{opacity:.3}
.tf span i{font-style:normal}
.xm{position:absolute;left:-8%;top:-4%;width:116%;height:112%}
.plates{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:330px}
.plate{width:var(--ps);height:var(--ps);border-radius:50%;background:#F1EAFE;border:3px solid #CDB8F5;display:grid;place-content:center;gap:0 1px;padding:6px}
.plate span{font-size:var(--es);line-height:1.12;text-align:center}
.vis{display:flex;flex-direction:column;align-items:center;gap:8px}
.tip{margin:0;font-size:15px;font-weight:700;color:#3D5A80;text-align:center;line-height:1.5;padding:0 6px}
.pill{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:22px;background:#E8F4FD;font-size:15px;font-weight:700;text-align:left;line-height:1.4}
.ansrow{display:flex;align-items:center;justify-content:center;gap:10px;flex:none;flex-wrap:wrap}
.alabel{font-size:18px;font-weight:900}
.eqsym{font-size:40px;font-weight:700}
.box{min-width:104px;height:clamp(60px,9.6dvh,84px);padding:0 14px;border-radius:22px;border:4px solid #1F2A44;background:#fff;display:flex;align-items:center;justify-content:center;font-size:clamp(38px,6.8dvh,56px);font-weight:700}
.box.empty{border-style:dashed;border-color:#3D5A80;color:#8AA4BC}
.box.bad{border-color:#E0662A;background:#FFF1E6;color:#A8441A}
.box.good{border-color:#187A4B;background:#E5F5EC;color:#187A4B;border-style:solid}
.caret{display:inline-block;width:4px;height:.85em;border-radius:2px;background:#FF8A3D;margin-left:4px;animation:blink 1s steps(1) infinite}
.bubble{padding:8px 12px;border-radius:14px;background:#fff;font-size:14px;font-weight:700;line-height:1.4;max-width:100%}
.pad{margin-top:auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;flex:none}
.key{height:clamp(48px,7.6dvh,66px);border-radius:18px;background:#fff;box-shadow:0 4px 0 #C9DDEE;font-size:32px;font-weight:600;display:flex;align-items:center;justify-content:center}
.key.del{background:#D6E6F3;box-shadow:0 4px 0 #B3CBE0}
.key.ok{background:#187A4B;box-shadow:0 4px 0 #0F5232}
.choices{margin-top:auto;display:flex;flex-direction:column;gap:10px;flex:none}
.chint{font-size:14px;font-weight:700;color:#3D5A80;text-align:center}
.ch{min-height:clamp(62px,10dvh,88px);border-radius:24px;background:#fff;box-shadow:0 4px 0 #C9DDEE;display:flex;align-items:center;gap:12px;padding:6px 16px;text-align:left;width:100%}
.ch .cn{width:50px;font-size:44px;font-weight:700;text-align:center;flex:none;line-height:1}
.ch .ems{font-size:clamp(20px,3.2dvh,26px);line-height:1.15;display:flex;flex-wrap:wrap}
.ch.no{opacity:.35;pointer-events:none}
.ch.yes{background:#E5F5EC;box-shadow:0 4px 0 #187A4B}
.revealgo{margin-top:auto}
.pulse{animation:pulse 1s ease-in-out infinite}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px) rotate(-2deg)}40%{transform:translateX(9px) rotate(2deg)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes blink{50%{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes bounce{0%{transform:scale(.3)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes hop{0%{transform:translateY(16px);opacity:0}60%{transform:translateY(-8px);opacity:1}100%{transform:none}}

/* correct overlay */
.layer{position:absolute;inset:0;background:#FFF4D6;display:none;flex-direction:column;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top,0px) + 22px) 18px calc(env(safe-area-inset-bottom,0px) + 18px);z-index:5;overflow:hidden}

function plural(it, n){ return n === 1 ? it[2][0] : it[2][1]; }
var STORY = {
  zh:{add:['{w}有{A}{m}{n}，又拿到{B}{m}，現在一共有幾{m}？','籃子裡有{A}{m}{n}，{w}再放進{B}{m}，籃子裡有幾{m}？'],
      sub:['{w}有{A}{m}{n}，送給朋友{B}{m}，還剩幾{m}？','桌上有{A}{m}{n}，{w}拿走{B}{m}，桌上還剩幾{m}？'],
      mul:['每個盒子裝{B}{m}{n}，{A}個盒子一共有幾{m}？','有{A}個盤子，每盤放{B}{m}{n}，一共有幾{m}？'],
      div:['{A}{m}{n}平分給{B}個朋友，每人分到幾{m}？','把{A}{m}{n}平分裝進{B}個袋子，每袋有幾{m}？'], w:'小熊'},
  en:{add:['Little Bear has {A} {pA}. He gets {B} more. How many does he have now?','There are {A} {pA} in a basket. Little Bear puts in {B} more. How many are in the basket?'],
      sub:['Little Bear has {A} {pA}. He gives {B} to a friend. How many are left?','There are {A} {pA} on the table. Little Bear takes {B}. How many are left?'],
      mul:['Each box holds {B} {pB}. How many are in {A} boxes?','There are {A} plates with {B} {pB} on each. How many altogether?'],
      div:['Share {A} {pA} equally among {B} friends. How many does each friend get?','Put {A} {pA} equally into {B} bags. How many go in each bag?']},
  ja:{add:['くまくんは {n}を {A}{c} もっています。{B}{c} もらうと、ぜんぶで なん{c}？','かごに {n}が {A}{c} あります。くまくんが {B}{c} いれると、なん{c}に なる？'],
      sub:['くまくんは {n}を {A}{c} もっています。ともだちに {B}{c} あげると、のこりは なん{c}？','つくえに {n}が {A}{c} あります。くまくんが {B}{c} とると、のこりは なん{c}？'],
      mul:['はこ 1つに {n}が {B}{c} はいっています。はこ {A}つでは ぜんぶで なん{c}？','おさらが {A}まい あって、1まいに {n}が {B}{c}ずつ。ぜんぶで なん{c}？'],
      div:['{n} {A}{c}を {B}にんの ともだちに おなじ かずずつ わけると、1にん なん{c}？','{n} {A}{c}を {B}この ふくろに おなじ かずずつ いれると、1ふくろ なん{c}？']}
};
function fill(s, v){ return s.replace(/\{(\w+)\}/g, function(m, k){ return v[k] !== undefined ? v[k] : m; }); }
function storyText(q, speech){
  var lang = L(), it = q.item, tpl = STORY[lang][q.op][q.tpl % 2];
  if(lang === 'zh') return fill(tpl, {w:STORY.zh.w, A: speech ? zh(q.a, 1) : q.a, B: speech ? zh(q.b, 1) : q.b, m:it[1][1], n:it[1][0]});
  if(lang === 'en') return fill(tpl, {A:q.a, B:q.b, pA:plural(it, q.a), pB:plural(it, q.b)});
  return fill(tpl, {A:q.a, B:q.b, n:it[3][0], c:it[3][1]});
}
var OPW = {zh:{add:'加',sub:'減',mul:'乘以',div:'除以'}, en:{add:'plus',sub:'minus',mul:'times',div:'divided by'}, ja:{add:'たす',sub:'ひく',mul:'かける',div:'わる'}};
function sentence(q){
  var a = q.a, b = q.b, lang = L(), it = q.item, w = OPW[lang][q.op];
  var N = function(x){ return lang === 'zh' ? zh(x) : x; };
  if(q.kind === 'story') return storyText(q, true);
  if(q.kind === 'count'){
    if(lang === 'zh') return '數數看，有幾' + it[1][1] + it[1][0] + '？';
    if(lang === 'en') return 'How many ' + it[2][1] + ' are there?';
    return it[3][0] + 'は なん' + it[3][1] + '？';
  }
  if(q.kind === 'pick'){
    if(lang === 'zh') return '哪一組有' + zh(a, 1) + it[1][1] + it[1][0] + '？';
    if(lang === 'en') return 'Which group has ' + a + ' ' + plural(it, a) + '?';
    return it[3][0] + 'が ' + a + it[3][1] + ' あるのは どれ？';
  }
  if(q.kind === 'cmpg'){
    if(lang === 'zh') return '哪一邊的' + it[1][0] + '比較多？';
    if(lang === 'en') return 'Which side has more ' + it[2][1] + '?';
    return 'どちらの ' + it[3][0] + 'が おおい？';
  }
  if(q.kind === 'cmp'){
    var e = N(a) + (lang === 'zh' ? '' : ' ') + w + (lang === 'zh' ? '' : ' ') + N(b);
    if(lang === 'zh') return e + '，和' + zh(q.k) + '比，哪邊比較大？';
    if(lang === 'en') return 'Which is bigger: ' + e + ', or ' + q.k + '?';
    return e + ' と ' + q.k + '、どちらが おおきい？';
  }
  if(q.kind === 'miss'){
    var A = q.pos === 'a' ? null : a, B = q.pos === 'b' ? null : b;
    if(lang === 'zh') return (A === null ? '多少' : zh(A)) + w + (B === null ? '多少' : zh(B)) + '等於' + zh(q.res) + '？';
    if(lang === 'en') return (A === null ? 'What' : A) + ' ' + w + ' ' + (B === null ? 'what' : B) + ' equals ' + q.res + '?';
    return (A === null ? 'いくつ' : A) + ' ' + w + ' ' + (B === null ? 'いくつ' : B) + ' で ' + q.res + '？';
  }
  if(lang === 'zh'){
    var n = it[1][0], m = it[1][1];
    if(!q.small) return zh(a) + w + zh(b) + '，等於多少？';
    if(q.op === 'add') return zh(a,1)+m+n+'，再加'+zh(b,1)+m+'，一共有幾'+m+'？';
    if(q.op === 'sub') return zh(a,1)+m+n+'，拿走'+zh(b,1)+m+'，還剩幾'+m+'？';
    if(q.op === 'mul') return zh(a,1)+'個盤子，每盤'+zh(b,1)+m+n+'，一共有幾'+m+'？';
    return zh(a,1)+m+n+'，平分到'+zh(b,1)+'個盤子，每盤幾'+m+'？';
  }
  if(lang === 'en'){
    if(!q.small) return 'What is ' + a + ' ' + w + ' ' + b + '?';
    if(q.op === 'add') return a+' '+plural(it,a)+' and '+b+' more. How many altogether?';
    if(q.op === 'sub') return a+' '+plural(it,a)+', take away '+b+'. How many are left?';
    if(q.op === 'mul') return a+' plate'+(a===1?'':'s')+' with '+b+' '+plural(it,b)+' on each. How many altogether?';
    return 'Share '+a+' '+plural(it,a)+' equally on '+b+' plate'+(b===1?'':'s')+'. How many on each plate?';
  }
  var jn = it[3][0], c = it[3][1];
  if(!q.small) return a + ' ' + w + ' ' + b + ' は いくつ？';
  if(q.op === 'add') return jn+'が '+a+c+'、'+b+c+' ふえると、ぜんぶで なん'+c+'？';
  if(q.op === 'sub') return jn+'が '+a+c+'、'+b+c+' へると、のこりは なん'+c+'？';
  if(q.op === 'mul') return 'おさらが '+a+'まい、1まいに '+jn+'が '+b+c+'ずつ。ぜんぶで なん'+c+'？';
  return jn+' '+a+c+'を '+b+'まいの おさらに おなじ かずずつ わけると、1まいに なん'+c+'？';
}
function textHint(q){
  var a = q.a, b = q.b;
  if(q.kind === 'count' || q.kind === 'pick') return t('hCountOne');
  if(q.kind === 'cmpg') return t('hCmpg');
  if(q.kind === 'cmp') return t('hCmp', {e: a + ' ' + OPS[q.op].sym + ' ' + b, k: q.k});
  if(q.kind === 'miss'){
    if(q.op === 'add') return t('hMissAdd', {k: q.pos === 'b' ? a : b, c: q.res});
    return q.pos === 'b' ? t('hMissSub', {a:a, c:q.res}) : t('hMissSubA', {c:q.res, b:b});
  }
  if(q.op === 'add'){
    if(q.small) return t('hCountOn', {a:a, b:b});
    var u = a%10 + b%10;
    return t('hUnitsAdd', {x:a%10, y:b%10, u:u}) + (u >= 10 ? t('hCarry') : t('hThenTens'));
  }
  if(q.op === 'sub'){
    if(q.small) return t('hCountLeft');
    return (a%10 < b%10) ? t('hBorrow', {x:a%10, y:b%10}) : t('hUnitsSub', {x:a%10, y:b%10, u:a%10-b%10});
  }
  if(q.op === 'mul'){
    if(a <= 5) return t('hMulRep', {n:a, m:b, expr:Array(a).fill(b).join(' + ')});
    if(b <= 5) return t('hMulRep', {n:b, m:a, expr:Array(b).fill(a).join(' + ')});
    return t('hMulTable', {a:a, b:b});
  }
  return t('hDivThink', {a:a, b:b});
}

/* ---------- visual builders ---------- */
function esFor(n){ return n <= 5 ? 32 : n <= 10 ? 22 : 18; }
function frames(n, em, opt){
  opt = opt || {};
  var cross = opt.cross || 0, ghost = opt.ghost || 0, total = n + ghost, es = opt.es || esFor(total), out = '', k = 0, rem = total;
  while(rem > 0){
    var g = Math.min(10, rem); rem -= g;
    var cols, cells;
    if(total <= 5){ cols = total; cells = total; }
    else if(total <= 10){ cols = 5; cells = 10; }
    else if(g === 10){ cols = 5; cells = 10; }
    else { cols = Math.min(5, g); cells = g; }
    out += '<div class="tf'+(total > 10 && g === 10 ? ' box' : '')+(opt.labels ? ' lab' : '')+'" style="grid-template-columns:repeat('+cols+',1fr);--es:'+es+'px">';
    for(var c=0;c<cells;c++){
      if(c < g){
        if(k >= n){ out += '<span class="gh"></span>'; }
        else { var x = k >= n - cross; out += '<span'+(x?' class="x"':'')+(opt.labels?' data-n="'+(k+1)+'"':'')+'><i>'+em+'</i>'+(x?XM:'')+'</span>'; }
        k++;
      } else out += '<span></span>';
    }
    out += '</div>';
  }
  return '<div class="stack">'+out+'</div>';
}
function makeTen(q){
  var a = q.a, r = q.a + q.b - 10, s = '<div class="stack"><div class="tf box" style="grid-template-columns:repeat(5,1fr);--es:20px">';
  for(var i=0;i<10;i++) s += '<span'+(i>=a?' class="hl"':'')+'>'+q.em+'</span>';
  s += '</div>';
  if(r > 0){
    s += '<div class="tf" style="background:none;padding:2px;grid-template-columns:repeat('+Math.min(5,r)+',1fr);--es:20px">';
    for(var j=0;j<r;j++) s += '<span class="hl">'+q.em+'</span>';
    s += '</div>';
  }
  return s+'</div>';
}
function plates(groups, per, em){
  var ps = per === 0 ? 56 : groups <= 3 ? 96 : groups <= 4 ? 80 : 68, sm = ps < 80, es = per <= 4 ? (sm ? 18 : 22) : per <= 6 ? (sm ? 14 : 18) : (sm ? 12 : 15);
  var cols = per <= 1 ? 1 : per <= 4 ? 2 : per <= 9 ? 3 : 4, out = '<div class="plates">';
  for(var g=0; g<groups; g++){
    out += '<div class="plate" style="--ps:'+ps+'px;--es:'+es+'px;grid-template-columns:repeat('+cols+',auto)">';
    for(var i=0;i<per;i++) out += '<span>'+em+'</span>';
    out += '</div>';
  }
  return out+'</div>';
}
/* place-value blocks: bar = 10, cube = 1 */
function blocks(n, opt){
  opt = opt || {};
  var tens = Math.floor(n/10), ones = n%10, broken = opt.broken && tens > 0;
  if(broken){ tens--; }
  var ct = opt.crossTens || 0, co = opt.crossOnes || 0, h = '<div class="blk" aria-hidden="true"><div class="rods">';
  for(var i=0;i<tens;i++) h += '<span class="rod'+(i >= tens-ct ? ' x' : '')+'"></span>';
  h += '</div>';
  var cubes = [];
  for(var j=0;j<ones;j++) cubes.push('');
  if(broken) for(var k=0;k<10;k++) cubes.push('brk');
  var total = cubes.length, cols = total > 10 ? 5 : 3;
  h += '<div class="cubes" style="grid-template-columns:repeat('+cols+',9px)">';
  cubes.forEach(function(c, idx){ h += '<span class="cube'+(c ? ' '+c : '')+(idx >= total-co ? ' x' : '')+'"></span>'; });
  return h + '</div></div>';
}

  var earn = ops.filter(function(o){ return R.opCount[o] >= 2; });

    if(left.length){
      var idx = pick(left); have.push(idx); p.books[key] = have;
      got.push({key:key, op:op, em:pool(key).e[idx], idx:idx, done: have.length === 30});

  var newCount = got.filter(function(g){ return !g.trophy; }).length;

    left--;
  };
  clearInterval(restT); tick(); restT = setInterval(tick, 1000);
  show('rest'); say(t('restTitle') + ' ' + t('restBody'));
}
$('#restDone').addEventListener('click', function(){ playMs = 0; clearInterval(restT); renderHome(); show('home'); });

/* =====================================================================
   sticker book
   ===================================================================== */
var BV = {op:'add', age:5, from:'home', fresh:[]};
function openBook(op, age, got){
  BV.op = op; BV.age = OPS[op].ages.indexOf(age) >= 0 ? age : OPS[op].ages[0];
  BV.from = cur === 'end' ? 'end' : 'home';
  BV.fresh = (got || []).filter(function(g){ return !g.trophy; }).map(function(g){ return g.key+':'+g.idx; });
  renderBook(); show('book');
}
function renderBook(){
  var li = LI[L()], p = P();
  $('#bTitle').textContent = t('bookTitle', {name:p.name});
  $('#bOps').innerHTML = OPORDER.map(function(op){
    return '<button class="press'+(op===BV.op?' sel':'')+'" data-op="'+op+'" aria-pressed="'+(op===BV.op)+'" style="background:'+(op===BV.op?OPS[op].bg:'#fff')+'"><span class="n">'+OPS[op].sym+'</span>'+opName(op)+'</button>';
  }).join('');
  $('#bAges').innerHTML = OPS[BV.op].ages.map(function(a){
    return '<button class="press'+(a===BV.age?' sel':'')+'" data-age="'+a+'" aria-pressed="'+(a===BV.age)+'">'+t('ageLabel',{a:a})+' <span class="n" style="font-weight:600;color:#3D5A80">'+owned(p, bookKey(BV.op, a)).length+'</span></button>';
  }).join('');
  var key = bookKey(BV.op, BV.age), have = owned(p, key), Pl = pool(key), tro = p.trophies[key] || 0;
  $('#bTheme').textContent = Pl.n[li];
  $('#bCount').innerHTML = '<span class="n">'+have.length+' / 30</span>'+(tro ? '　'+t('trophies',{n:tro}) : '');
  var g = '';
  for(var i=0;i<30;i++){
    if(have.indexOf(i) >= 0) g += '<span class="'+(BV.fresh.indexOf(key+':'+i) >= 0 ? 'new' : '')+'">'+Pl.e[i]+'</span>';
    else g += '<span class="none n" aria-hidden="true">'+(i+1)+'</span>';
  }
  $('#bGrid').innerHTML = g;
}
$('#bOps').addEventListener('click', function(e){
  var b = e.target.closest('[data-op]'); if(!b) return;
  BV.op = b.dataset.op; if(OPS[BV.op].ages.indexOf(BV.age) < 0) BV.age = OPS[BV.op].ages[0];
  sfx.tap(); renderBook();
});
$('#bAges').addEventListener('click', function(e){
  var b = e.target.closest('[data-age]'); if(!b) return;
  BV.age = +b.dataset.age; sfx.tap(); renderBook();
});
$('#bBack').addEventListener('click', function(){ if(BV.from === 'end') show('end'); else { renderHome(); show('home'); } });

/* =====================================================================
   parent settings + reports + data
   ===================================================================== */
var RP = {kid:null, days:7, clearArm:false};
function openParent(){ if(!profileById(RP.kid)) RP.kid = S.current; RP.clearArm = false; renderParent(); show('parent'); }
function seg(name, opts, cur0, extra, attrs){
  return '<div class="seg'+(extra||'')+'" data-set="'+name+'"'+(attrs||'')+'>'+opts.map(function(o){
    var on = String(o[0]) === String(cur0);
    return '<button class="'+(o[2]||'')+(on ? ' sel' : '')+'" data-val="'+o[0]+'" aria-pressed="'+on+'">'+o[1]+'</button>';
  }).join('')+'</div>';
}
function eqText(r){
  var s = OPS[r.op] ? OPS[r.op].sym : '';
  if(r.k === 'count') return '🔢 ' + r.a;
  if(r.k === 'pick') return '→ ' + r.a;
  if(r.k === 'cmpg') return r.a + ' ○ ' + r.b;
  if(r.k === 'cmp') return r.a + ' ' + s + ' ' + r.b + ' ○ ' + r.kk;
  if(r.k === 'miss') return (r.pos === 'a' ? '?' : r.a) + ' ' + s + ' ' + (r.pos === 'b' ? '?' : r.b) + ' = ' + r.res;
  return r.a + ' ' + s + ' ' + r.b;
}
function pctRow(label, rs, color){
  var ok = rs.filter(function(r){ return r.f; }).length, pct = Math.round(ok/rs.length*100);
  return '<div class="stat"><span class="k">'+label+'</span><span class="tr"><i style="width:'+pct+'%;background:'+(color||'#2F6FD6')+'"></i></span><span class="v n">'+pct+'%・'+t('qn',{n:rs.length})+'</span></div>';
}
function renderParent(){
  var st = S.settings, ho = T[L()].hintOpt;
  // children
  var k = '';
  S.profiles.forEach(function(p){ k += '<button class="kidrow press" data-edit="'+p.id+'"><span class="av" aria-hidden="true">'+p.avatar+'</span><span class="nm">'+esc(p.name)+'<small>'+t('ageLabel',{a:p.age})+'・'+t('chip',{n:totalStickers(p)})+'</small></span><span class="mini">'+T[L()].edit_+'</span></button>'; });
  k += '<div class="btnrow" style="grid-template-columns:1fr"><button class="sbtn" id="addKid">'+t('addKid')+'</button></div>';
  $('#pKids').innerHTML = k;
  // settings
  $('#pSettings').innerHTML =
    '<div class="prow col"><span class="plabel" style="margin-bottom:8px">'+t('language')+'</span>'+seg('lang', [['zh','中文'],['en','English'],['ja','日本語']], st.lang)+'</div>'+
    '<div class="prow"><span class="plabel">'+t('perRound')+'</span>'+seg('perRound', [[5,'5','n'],[10,'10','n'],[15,'15','n']], st.perRound)+'</div>'+
    '<div class="prow"><span class="plabel">'+t('autoNext')+'</span><button class="tog'+(st.autoNext?' on':'')+'" data-tog="autoNext" aria-pressed="'+st.autoNext+'" aria-label="'+t('autoNext')+'"></button></div>'+
    '<div class="prow"><span class="plabel">'+t('voice')+'</span><span style="display:flex;align-items:center;gap:6px"><button class="mini" id="testVoice">'+t('test')+'</button><button class="tog'+(st.voice?' on':'')+'" data-tog="voice" aria-pressed="'+st.voice+'" aria-label="'+t('voice')+'"></button></span></div>'+
    '<div class="prow"><span class="plabel">'+t('sfx')+'</span><button class="tog'+(st.sfx?' on':'')+'" data-tog="sfx" aria-pressed="'+st.sfx+'" aria-label="'+t('sfx')+'"></button></div>'+
    '<div class="prow col"><span class="plabel" style="margin-bottom:8px">'+t('hint')+'</span>'+seg('hint', [['auto',ho.auto],['always',ho.always],['wrong',ho.wrong],['off',ho.off]], st.hint, ' g4')+'</div>'+
    '<div class="prow col"><span class="plabel" style="margin-bottom:8px">'+t('dailyLimit')+'</span>'+seg('dailyLimit', [[0,t('unlimited')],[3,'3','n'],[5,'5','n'],[10,'10','n']], st.dailyLimit)+'</div>'+
    '<div class="prow col"><span class="plabel" style="margin-bottom:8px">'+t('breakMin')+'</span>'+seg('breakMin', [[0,t('off')],[10,t('minUnit',{n:10})],[15,t('minUnit',{n:15})],[20,t('minUnit',{n:20})]], st.breakMin)+'</div>';
  // report
  var p = profileById(RP.kid) || P(), h = '';
  if(S.profiles.length > 1) h += '<div class="ptabs">' + S.profiles.map(function(x){ return '<button class="'+(x.id===p.id?'sel':'')+'" data-rkid="'+x.id+'">'+x.avatar+' '+esc(x.name)+'</button>'; }).join('') + '</div>';
  var since = dayStart(RP.days - 1), sinceStr = dstr(since);
  var logs = p.log.filter(function(r){ return r.d >= sinceStr; });
  var rounds = p.rounds.filter(function(x){ return x >= since.getTime(); }).length;
  h += '<div class="prow">'+seg('days', [[7,t('range',{n:7})],[30,t('range',{n:30})]], RP.days)+'<span class="muted">'+t('summary',{r:rounds, q:logs.length})+'</span></div>';
  if(!logs.length) h += '<p class="muted" style="margin:12px 0">'+t('none')+'</p>';
  else {
    h += '<span class="subT">'+t('byOp')+'</span>';
    OPORDER.forEach(function(op){ var rs = logs.filter(function(r){ return r.op === op; }); if(rs.length) h += pctRow(opName(op), rs, OPS[op].ink); });
    h += '<span class="subT">'+t('bySkill')+'</span>';
    ['count','cmpg','r10','r20','r100','carry','nocarry','borrow','noborrow','miss','cmp','story'].forEach(function(g){
      var rs = logs.filter(function(r){ return (r.g || []).indexOf(g) >= 0; }); if(rs.length) h += pctRow(T[L()].skill[g], rs);
    });
    h += '<p class="muted" style="margin:4px 0 0">'+t('pctNote')+'</p>';
  }
  // weekly trend (always 4 weeks)
  var wk = [], mx = 1;
  for(var w=3; w>=0; w--){
    var from = dstr(dayStart(w*7+6)), to = dstr(dayStart(w*7));
    var rs = p.log.filter(function(r){ return r.d >= from && r.d <= to; });
    var pc = rs.length ? Math.round(rs.filter(function(r){ return r.f; }).length / rs.length * 100) : null;
    wk.push({n:rs.length, pc:pc}); mx = Math.max(mx, rs.length);
  }
  h += '<span class="subT">'+t('trend')+'</span><div class="wk">' + wk.map(function(x, i){ return '<div><b class="n">'+x.n+(x.pc !== null ? '・'+x.pc+'%' : '')+'</b><i style="height:'+(x.n/mx*70)+'%"></i><span>'+T[L()].weeks[i]+'</span></div>'; }).join('') + '</div>';
  // difficulty levels for this child's age
  h += '<span class="subT">'+t('levels',{age:t('ageLabel',{a:p.age})})+'</span>';
  AGE[p.age].ops.forEach(function(op){
    var o = lvObj(p, op, p.age);
    h += '<div class="prow lv" style="min-height:52px"><span class="plabel">'+opName(op)+'</span>'+seg('lock', [[0,t('auto')+'（'+o.l+'）'],[1,'1','n'],[2,'2','n'],[3,'3','n']], o.lock, '', ' data-op="'+op+'"')+'</div>';
  });
  // mistakes
  var miss = {};
  logs.forEach(function(r){ if(!r.w || !r.w.length) return; var key = eqText(r); miss[key] = miss[key] || {r:r, c:0}; miss[key].c++; miss[key].r = r; });
  var list = Object.keys(miss).map(function(x){ return miss[x]; }).sort(function(x,y){ return y.c - x.c; }).slice(0,8);
  if(list.length){
    h += '<span class="subT">'+t('mistakes')+'</span><div class="chips">';
    list.forEach(function(m){ h += '<span class="n">'+esc(eqText(m.r))+' → '+t('said',{v:m.r.w[0]})+(m.c > 1 ? t('times',{n:m.c}) : '')+'</span>'; });
    h += '</div>';
  }
  $('#pStats').innerHTML = h;
  // data
  $('#pData').innerHTML = '<div class="btnrow"><button class="sbtn" id="expBtn">'+t('exportBtn')+'</button><button class="sbtn" id="impBtn">'+t('importBtn')+'</button></div>'+
    '<button class="danger'+(RP.clearArm?' arm':'')+'" id="clearBtn" style="width:100%;margin-bottom:12px">'+(RP.clearArm ? t('clearConfirm') : t('clearKid',{name:esc(p.name)}))+'</button>';
}
T.zh.edit_ = '編輯'; T.en.edit_ = 'Edit'; T.ja.edit_ = 'へんしゅう';
$('#parent').addEventListener('click', function(e){
  var el;
  if((el = e.target.closest('[data-edit]'))){ openEdit(el.dataset.edit); return; }
  if(e.target.closest('#addKid')){ openEdit(null); return; }
  if((el = e.target.closest('[data-rkid]'))){ RP.kid = el.dataset.rkid; RP.clearArm = false; renderParent(); return; }
  if((el = e.target.closest('[data-tog]'))){ var k = el.dataset.tog; S.settings[k] = !S.settings[k]; save(); renderParent(); return; }
  if(e.target.closest('#testVoice')){ pickVoice(); say(t('testSay'), true); return; }
  if(e.target.closest('#expBtn')){ exportData(); return; }
  if(e.target.closest('#impBtn')){ confirmBox(t('importQ'), t('chooseFile'), function(){ $('#importFile').click(); }); return; }
  if(e.target.closest('#clearBtn')){
    if(!RP.clearArm){ RP.clearArm = true; renderParent(); return; }
    var p = profileById(RP.kid) || P(); p.log = []; p.rounds = []; p.review = []; RP.clearArm = false; save(); renderParent(); toast(t('cleared')); return;
  }
  if((el = e.target.closest('.seg button'))){
    var sg = el.parentNode, name = sg.dataset.set, val = el.dataset.val;
    if(name === 'days'){ RP.days = +val; renderParent(); return; }
    if(name === 'lock'){ var pp = profileById(RP.kid) || P(); lvObj(pp, sg.dataset.op, pp.age).lock = +val; save(); renderParent(); return; }
    S.settings[name] = (name === 'perRound' || name === 'dailyLimit' || name === 'breakMin') ? +val : val; save();
    if(name === 'lang'){ applyI18n(); pickVoice(); }
    renderParent();
  }
});
$('#pBack').addEventListener('click', function(){ renderHome(); show('home'); });
function exportData(){
  try{
    var blob = new Blob([JSON.stringify({app:'numgame', exported:new Date().toISOString(), data:S}, null, 1)], {type:'application/json'});
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'numgame-backup-' + today() + '.json';
    document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast(t('exported'));
  }catch(e){ toast(t('importBad')); }
}
$('#importFile').addEventListener('change', function(e){
  var f = e.target.files && e.target.files[0]; if(!f) return;
  var rd = new FileReader();
  rd.onload = function(){
    try{
      var j = JSON.parse(rd.result), d = j && j.app === 'numgame' ? j.data : j;
      if(!d || d.v !== 3 || !Array.isArray(d.profiles) || !d.profiles.length) throw 0;
      S = normalize(d); S.onboarded = true; save(); applyI18n(); pickVoice(); RP.kid = S.current; renderParent(); toast(t('imported'));
    }catch(err){ toast(t('importBad')); }
    e.target.value = '';
  };
  rd.readAsText(f);
});

if(location.hash === '#test') window.__NG = {genQ:genQ, tagsOf:tagsOf, sentence:sentence, textHint:textHint, setLang:function(l){ S.settings.lang = l; }, state:function(){ return S; }, q:function(){ return R && R.q; }};
/* ---------- start ---------- */
applyI18n();
if(!S.onboarded || !S.profiles.length){ OB.age = 5; renderOnb(); show('onb'); }
else if(S.profiles.length > 1){ renderWho(); show('who'); }
else { renderHome(); show('home'); }
save();
if('serviceWorker' in navigator && location.protocol === 'https:'){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
if(navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(function(){}); }
})();
</script>
